name: Shell Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: ['opened', 'edited', 'reopened', 'synchronize']

jobs:
  shellcheck:
    name: Shell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Shell Files
        # dogfood the action as defined in this repo (tests the PR's own code)
        uses: ./
